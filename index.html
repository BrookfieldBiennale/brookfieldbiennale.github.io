<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brookfield Biennale — Sept 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE0;
    --ink: #181815;
    --pop: #FF5A1F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* photocopy grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.05) 0, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,0.05) 0, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.05) 0, transparent 2px);
    background-size: 3px 3px;
  }

  .flyer {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border: 3px solid var(--ink);
    padding: 46px 30px 40px;
    transform: rotate(-1.4deg);
    box-shadow: 7px 7px 0 var(--ink);
  }

  .tape {
    position: absolute;
    width: 74px;
    height: 26px;
    background: rgba(239, 235, 224, 0.75);
    border: 1px solid rgba(24,24,21,0.25);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .tape.tl { top: -14px; left: 24px; transform: rotate(-8deg); }
  .tape.br { bottom: -14px; right: 20px; transform: rotate(6deg); }

  .stamp {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border: 2px solid var(--pop);
    color: var(--pop);
    display: inline-block;
    padding: 5px 10px;
    transform: rotate(-3deg);
    margin-bottom: 26px;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    font-weight: 400;
    font-size: clamp(46px, 12vw, 68px);
    line-height: 0.92;
    color: var(--ink);
    transform: rotate(-0.6deg);
  }

  h1 span {
    display: block;
    color: var(--pop);
  }

  .rule {
    height: 4px;
    background: var(--ink);
    margin: 26px 0;
    transform: skewX(-15deg);
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .info-line {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }

  .info-line .tag {
    font-size: 11px;
    letter-spacing: 0.12em;
    background: var(--ink);
    color: var(--paper);
    padding: 2px 6px;
    transform: rotate(-2deg);
    flex-shrink: 0;
  }

  .scrawl {
    margin-top: 30px;
    font-family: 'Permanent Marker', cursive;
    font-size: 14px;
    color: var(--ink);
    opacity: 0.55;
    transform: rotate(1.2deg);
  }

  @media (max-width: 420px) {
    .flyer { padding: 36px 20px 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flyer { transform: none; }
  }
</style>
</head>
<body>

  <div class="flyer">
    <span class="tape tl"></span>
    <span class="tape br"></span>

    <div class="stamp">low stakes / DIY</div>

    <h1>Brookfield<span>Biennale</span></h1>

    <div class="rule"></div>

    <div class="info">
      <div class="info-line"><span class="tag">when</span> Sept 26</div>
      <div class="info-line"><span class="tag">where</span> Brookfield, PEI</div>
    </div>

    <p class="scrawl">more soon...</p>
  </div>

</body>
</html>
