<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brookfield Biennale — Sept 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE0;
    --ink: #24231D;
    --rust: #B5592E;
    --leaf: #55693F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
  }

  /* ---------- video card ---------- */

  .card {
    position: relative;
    z-index: 1;
    background: var(--paper);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--rust);
    padding: 16px;
  }

  .video-frame {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border: 1px solid var(--ink);
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .caption {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    letter-spacing: 0.03em;
  }

  .caption .name {
    font-family: 'Permanent Marker', cursive;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .caption .date { color: var(--rust); font-weight: 700; }
  .caption .place { color: var(--ink); opacity: 0.7; }
  .caption .dot { opacity: 0.4; margin: 0 6px; }

  .more {
    text-align: center;
    margin-top: 30px;
    font-family: 'Permanent Marker', cursive;
    font-size: 14px;
    color: var(--ink);
    opacity: 0.45;
  }

  /* ---------- photo row ---------- */

  .photo-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 34px;
  }

  .snap {
    width: 96px;
    height: 96px;
    background: var(--paper);
    padding: 5px 5px 16px;
    box-shadow: 3px 4px 8px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .snap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .snap.r1 { transform: rotate(-6deg); }
  .snap.r2 { transform: rotate(3deg); }
  .snap.r3 { transform: rotate(-2deg); }

  @media (max-width: 480px) {
    .stage { max-width: 320px; }
    .photo-row { gap: 10px; }
    .snap { width: 82px; height: 82px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="card">
      <div class="video-frame">
        <video autoplay muted loop playsinline>
          <source src="assets/BBSquare.mp4" type="video/mp4">
        </video>
      </div>
      <div class="caption">
        <div class="name">Brookfield Biennale</div>
        <span class="date">Sept 26</span><span class="dot">·</span><span class="place">Brookfield, PEI</span>
      </div>
    </div>

    <p class="more">more soon...</p>

    <div class="photo-row">
      <div class="snap r1"><img src="assets/BB3.jpg" alt="Potato field rows, PEI"></div>
      <div class="snap r2"><img src="assets/BB1.jpg" alt="Painted flower mural"></div>
      <div class="snap r3"><img src="assets/BB2.jpg" alt="Dusty truck window"></div>
    </div>
  </div>

</body>
</html>
