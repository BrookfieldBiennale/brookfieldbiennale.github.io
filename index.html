<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brookfield Biennale — Sept 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEBE0;
    --ink: #24231D;
    --rust: #B5592E;
    --leaf: #55693F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--rust);
    padding: 44px 32px 36px;
    text-align: center;
  }

  .sprig {
    color: var(--leaf);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    font-weight: 400;
    font-size: clamp(38px, 9vw, 50px);
    line-height: 1.08;
    color: var(--ink);
  }

  .rule {
    width: 60px;
    height: 3px;
    background: var(--rust);
    margin: 22px auto 26px;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  .info .date { color: var(--rust); font-weight: 700; }
  .info .place { color: var(--ink); opacity: 0.75; }

  .more {
    margin-top: 30px;
    font-family: 'Permanent Marker', cursive;
    font-size: 14px;
    color: var(--ink);
    opacity: 0.45;
  }
</style>
</head>
<body>

  <div class="card">
    <svg class="sprig" width="46" height="24" viewBox="0 0 46 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 20 C 14 22, 20 6, 23 2 C 26 6, 32 22, 44 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M23 2 L23 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <h1>Brookfield<br>Biennale</h1>

    <div class="rule"></div>

    <div class="info">
      <div class="date">September 26</div>
      <div class="place">Brookfield, PEI</div>
    </div>

    <p class="more">more soon...</p>
  </div>

</body>
</html>
